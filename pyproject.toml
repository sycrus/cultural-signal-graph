[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cultural_signal_graph"]

[project]
name = "cultural-signal-graph"
version = "0.1.0"
description = "Agentic knowledge-graph system for cultural/trend forecasting"
requires-python = ">=3.11"
dependencies = [
    "rdflib>=7.0.0",
    "pyshacl>=0.26.0",
    "anthropic>=1.4.0",
    "langgraph>=1.2.11",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "python-pptx>=1.0.2",
    "langgraph-checkpoint-sqlite>=3.1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
